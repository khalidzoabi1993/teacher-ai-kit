<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ערכת הבינה המלאכותית של המורה</title>
<meta name="description" content="הנחיות מוכנות להעתקה ל-Gemini, ל-TestWiseAI ולכל כלי בינה מלאכותית · עברית · العربية · English">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Noto+Sans+Arabic:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#141726;--soft:#3d425c;--muted:#6a7090;--line:#dde1ef;--tint:#eef1fa;--gem:#2f6fed;--tw:#0b9a84;--cl:#c8701e;--any:#6a4fd8;--warn:#b7791f;--bad:#d6336c;--fld:#fff1cc;--fldink:#8a5a00;--sh:0 1px 2px rgba(20,23,38,.05),0 6px 24px rgba(20,23,38,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f16;--card:#161a29;--ink:#eceefa;--soft:#c5cae0;--muted:#9097b5;--line:#2a3050;--tint:#1c2136;--gem:#7fb4ff;--tw:#33e6c8;--cl:#ffb46b;--any:#a99dff;--warn:#fbbf24;--bad:#fb7185;--fld:#3a2f10;--fldink:#ffd27a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f16;--card:#161a29;--ink:#eceefa;--soft:#c5cae0;--muted:#9097b5;--line:#2a3050;--tint:#1c2136;--gem:#7fb4ff;--tw:#33e6c8;--cl:#ffb46b;--any:#a99dff;--warn:#fbbf24;--bad:#fb7185;--fld:#3a2f10;--fldink:#ffd27a;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Heebo,'Noto Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
html[lang=ar] body{font-family:'Noto Sans Arabic',Heebo,system-ui,sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 100px}
.top{background:linear-gradient(135deg,#1b1f4a,#0f2f3a);color:#fff;padding:18px 0 22px}
.top .wrap{padding-bottom:0}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;gap:6px;background:rgba(255,255,255,.1);padding:4px;border-radius:999px}
.langs button{border:0;background:none;color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px}
.langs button.on{background:#fff;color:#1b1f4a}
.sp{flex:1}
.thm{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;width:38px;height:38px;font-size:17px}
h1{font:900 30px/1.2 inherit;margin:18px 0 4px;font-family:inherit}
.top p{margin:0;color:#cfd5f5;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:var(--sh)}
.prof{border:2px solid var(--warn);margin-top:-14px;position:relative}
.prof h2{margin:0 0 2px;font:800 21px/1.3 inherit;font-family:inherit}
.prof>p{margin:0 0 12px;color:var(--soft);font-size:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fg{grid-template-columns:1fr}h1{font-size:25px}}
label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--warn) 45%,transparent);border-color:var(--warn)}
.ready{margin-top:10px;font-weight:700;font-size:15px}
.ready.ok{color:var(--tw)}.ready.no{color:var(--warn)}
.tabs{display:flex;gap:6px;margin:22px 0 6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;color:var(--soft)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{display:none}.pane.on{display:block}
.part{display:flex;align-items:center;gap:10px;margin:26px 0 2px}
.part b{font:900 24px/1 inherit;font-family:inherit;color:var(--c)}
.part span{color:var(--muted);font-weight:500}
.part::after{content:"";flex:1;height:2px;background:var(--line)}
.step{border-inline-start:6px solid var(--c)}
.step.done{opacity:.7}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.num{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
:root[data-theme="dark"] .num{color:#0d0f16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:#0d0f16}}
.sh h3{margin:0;font:800 20px/1.3 inherit;font-family:inherit;flex:1}
.dn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;margin:0}
.dn input{width:20px;height:20px;accent-color:var(--tw);padding:0}
ol.do{margin:6px 0 8px;padding-inline-start:22px}ol.do li{margin:3px 0}
.pr{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.prh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prh b{font-size:15px;color:var(--c);flex:1;min-width:120px}
.prh b:empty{min-width:0}
.txt{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.6}
.txt .v{color:var(--c);font-weight:700}
.f{background:var(--fld);color:var(--fldink);border-radius:6px;padding:0 5px;font-weight:700;display:inline-block;unicode-bidi:isolate;white-space:nowrap;line-height:1.4}
textarea{width:100%;min-height:160px;font:inherit;font-size:16px;line-height:1.6;padding:10px;border-radius:10px;border:1.5px solid var(--warn);background:var(--card);color:var(--ink);resize:vertical}
.btn{border:0;border-radius:999px;padding:8px 18px;font-weight:800;font-size:15px;background:var(--c);color:#fff;white-space:nowrap}
:root[data-theme="dark"] .btn{color:#0d0f16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d0f16}}
.btn.ok{background:var(--warn)}
.btn.gh{background:none;border:1.5px solid var(--line);color:var(--soft);font-weight:700;padding:7px 14px}
.edited{font-size:13px;color:var(--warn);font-weight:700;margin-top:6px}
a.open{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--c);border:2px solid var(--c);border-radius:999px;padding:6px 16px;text-decoration:none;margin:4px 0 4px 6px}
html[dir=ltr] a.open{margin:4px 6px 4px 0}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:12px;font-size:15.5px;margin-top:8px;background:color-mix(in srgb,var(--warn) 11%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.note.b{background:color-mix(in srgb,var(--bad) 9%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
ul.ck{list-style:none;margin:6px 0 0;padding:0}
ul.ck li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
ul.ck li:last-child{border-bottom:0}
ul.ck input{width:20px;height:20px;margin-top:4px;flex:none;accent-color:var(--tw);padding:0}
.hw{border:2px solid var(--tw)}.hw h3{margin:0 0 4px;font:800 20px inherit;font-family:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--soft)}
.chips button.on{background:var(--any);border-color:var(--any);color:#fff}
.lib .tag{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.lib h3{margin:0;font:800 19px/1.3 inherit;font-family:inherit;flex:1}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.rules{grid-template-columns:1fr}}
.rule{border-radius:14px;padding:14px;background:var(--tint)}
.rule b{display:block;font:900 28px/1.1 inherit;font-family:inherit;color:var(--any)}
.cmp{border-radius:14px;padding:14px;margin:10px 0}
.cmp.x{background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.cmp.v{background:color-mix(in srgb,var(--tw) 8%,transparent);border:1px solid color-mix(in srgb,var(--tw) 45%,transparent)}
.cmp h4{margin:0 0 4px}.cmp p{margin:0}.cmp small{display:block;margin-top:6px;color:var(--soft)}
.tips{margin:8px 0 0;padding-inline-start:22px}.tips li{margin:6px 0}
.bar{position:fixed;bottom:0;right:0;left:0;background:color-mix(in srgb,var(--card) 95%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.bar.on{display:block}
.bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px}
.bar .trk{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .trk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gem),var(--tw));transition:width .4s}

.tabs button.hot{border-color:var(--any);color:var(--any)}
.tabs button.hot.on{background:var(--any);color:#fff;border-color:var(--any)}
.bld{border:2px solid var(--any)}
.bh{margin:0 0 4px;font:800 22px/1.3 inherit;font-family:inherit}
.bp{margin:0 0 6px;color:var(--soft);font-size:15.5px}
.bq{font-weight:800;margin:16px 0 8px;font-size:17px}
.opt{font-weight:500;color:var(--muted);font-size:14px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;color:var(--soft)}
.tchips button.on{background:var(--any);border-color:var(--any);color:#fff}
.bw{min-height:120px;border-color:var(--line);font-size:17px}
.det{margin:10px 0 6px;font-size:15px;color:var(--soft)}.det b{color:var(--any)}
.bp-out{width:100%;min-height:200px;border:1.5px solid color-mix(in srgb,var(--any) 45%,var(--line));border-radius:12px;padding:14px;font:inherit;font-size:15.5px;line-height:1.7;background:var(--tint);color:var(--ink);resize:vertical;margin-top:6px;white-space:pre-wrap}
.bo-f{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.bo-f .hint{font-size:13.5px;color:var(--muted);flex:1}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13.5px;color:var(--soft)}

.tg{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tg label{display:flex;align-items:center;gap:10px;font-weight:500;margin:0;font-size:15.5px}
.tg input{width:20px;height:20px;accent-color:var(--any);padding:0;flex:none}
.bout{border:2px solid var(--any);position:sticky;top:8px}
.bo-h{display:flex;align-items:center;gap:10px}.bo-h h3{margin:0;flex:1;font:800 20px inherit;font-family:inherit}
.bo-h .btn{background:var(--any);color:#fff;font-size:16px;padding:10px 24px}
.meter{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-weight:700;font-size:15px}
.mt{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.mt i{display:block;height:100%;border-radius:6px;transition:width .4s}
.mt i.g0{background:var(--bad)}.mt i.g1{background:var(--warn)}.mt i.g2{background:var(--gem)}.mt i.g3{background:var(--tw)}
b.g0{color:var(--bad)}b.g1{color:var(--warn)}b.g2{color:var(--gem)}b.g3{color:var(--tw)}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts span{font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.parts .y{background:color-mix(in srgb,var(--tw) 14%,transparent);color:var(--tw)}
.parts .n{background:var(--tint);color:var(--muted)}
.bout .pr{max-height:none}
@media(min-width:900px){.bout{position:static}}

.fi{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--c,var(--any));border-radius:8px;padding:1px 6px;margin:1px 2px;max-width:100%;min-width:4ch;vertical-align:baseline;line-height:1.5}
select.fi{width:auto;padding:1px 4px}
.fi.em{background:var(--fld);color:var(--fldink);border-style:dashed;border-color:var(--fldink)}
.fi.em::placeholder{color:var(--fldink);opacity:.85}
.fi:focus{outline:2px solid var(--c,var(--any));outline-offset:1px}
textarea.fi.big{display:block;width:100%;min-height:72px;margin:6px 0 0;font-weight:500;resize:vertical}
.pr .txt input.fi,.pr .txt select.fi{width:auto;display:inline-block}
.tiph{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.sgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sg{display:inline-flex;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:999px;overflow:hidden}
.sg button{border:0;background:none;padding:5px 11px;font:inherit;font-size:14px;font-weight:600;color:var(--soft);cursor:pointer}
.sg .dx{padding:5px 9px 5px 4px;color:var(--muted);font-weight:800}
html[dir=ltr] .sg .dx{padding:5px 4px 5px 9px}
.sg.on{background:var(--warn);border-color:var(--warn)}.sg.on button{color:#fff}
button.sg.add{padding:5px 12px;font:inherit;font-size:14px;font-weight:800;color:var(--any);border:1.5px dashed var(--any);background:none;cursor:pointer}
.sgh{font-size:13.5px;color:var(--muted);align-self:center}
footer{text-align:center;color:var(--muted);font-weight:700;margin:30px 0 10px}
</style>
</head>

<header class="top"><div class="wrap">
  <div class="tb"><div class="langs" id="langs"><button data-l="he">עברית</button><button data-l="ar">العربية</button><button data-l="en">English</button></div><span class="sp"></span><button class="thm" id="thm" aria-label="theme">◐</button></div>

  <section class="pane" id="build"></section>
  <section class="pane" id="lib"></section>
  <section class="pane" id="how"></section>
  <footer data-t="foot"></footer>
</div>
<div class="bar" id="bar"><div class="in"><span id="prog"></span><div class="trk"><i id="progFill"></i></div><button class="btn gh" id="rst" data-t="reset"></button></div></div>

const subjKey = (s) => { s = (s || '').trim(); if (!s) return null; for (const L of ['he', 'ar', 'en']) for (const [k, v] of Object.entries(SUG[L].S)) if (v === s || v.replace(/^اللغة /, '') === s) return k; return null; };
const tKey = (s) => subjKey(s) || (s || '').trim();
const uniq = (a) => [...new Set(a.filter(Boolean))];
function subjects() { const l = lang(); return uniq([...Object.values(SUG[l].S), ...M.S]); }
function topics() { const s = $('#fS').value, k = subjKey(s), l = lang(); return uniq([...(k && TOPICS[k] ? TOPICS[k][l] : []), ...(M.T[tKey(s)] || [])]); }
function chips(box, list, mine, cur, kind) {
  const l = lang(), u = SUG[l];
  box.innerHTML = list.map((x) => `<span class="sg${x === cur ? ' on' : ''}"><button type="button" data-pick="${kind}" data-x="${esc(x)}">${esc(x)}</button>${mine.includes(x) ? `<button type="button" class="dx" data-del="${kind}" data-x="${esc(x)}" aria-label="${u.del}" title="${u.del}">×</button>` : ''}</span>`).join('')
    + `<button type="button" class="sg add" data-add="${kind}">${u.add}</button>`
    + (kind === 'T' && !subjKey($('#fS').value) && !list.length ? `<span class="sgh">${u.pickS}</span>` : '');
}
function lists() {
  ['S', 'T'].forEach((k) => {
    const dl = document.getElementById('dl' + k), items = k === 'S' ? subjects() : topics();
    dl.innerHTML = items.map((x) => `<option value="${esc(x)}">`).join('');
  });
}
function render() {
  chips($('#sgS'), subjects(), M.S, $('#fS').value.trim(), 'S');
  chips($('#sgT'), topics(), M.T[tKey($('#fS').value)] || [], $('#fT').value.trim(), 'T');
  lists();
  document.querySelectorAll('.fi[data-v="S"],.fi[data-v="T"]').forEach((el) => el.setAttribute('list', 'dl' + el.dataset.v));
}
function set(k, x) { const f = $('#f' + k); f.value = x; f.dispatchEvent(new Event('input', { bubbles: true })); }
function addMine(k, x) {
  x = (x || '').trim(); if (!x) return;
  if (k === 'S') { if (!subjects().includes(x)) M.S.push(x); }
  else { const tk = tKey($('#fS').value); M.T[tk] = M.T[tk] || []; if (!topics().includes(x)) M.T[tk].push(x); }
  save();
}
document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-pick]'); if (p) { set(p.dataset.pick, p.dataset.x); render(); return; }
  const d = e.target.closest('[data-del]'); if (d) { const k = d.dataset.del, x = d.dataset.x; if (k === 'S') M.S = M.S.filter((y) => y !== x); else { const tk = tKey($('#fS').value); M.T[tk] = (M.T[tk] || []).filter((y) => y !== x); } save(); render(); return; }
  const a = e.target.closest('[data-add]'); if (a) { const k = a.dataset.add, x = prompt(SUG[lang()].addQ); if (x && x.trim()) { addMine(k, x); set(k, x.trim()); render(); } }
});
// whatever a teacher types and leaves in the field is remembered as theirs
['S', 'T'].forEach((k) => $('#f' + k).addEventListener('change', (e) => { addMine(k, e.target.value); render(); }));
document.addEventListener('change', (e) => { const el = e.target; if (el.matches && el.matches('.fi[data-v="S"],.fi[data-v="T"]')) { addMine(el.dataset.v, el.value); render(); } });
['fS', 'fT'].forEach((id) => $('#' + id).addEventListener('input', () => setTimeout(render, 0)));
document.querySelectorAll('#langs button,#tabs button').forEach((b) => b.addEventListener('click', () => setTimeout(render, 0)));
new MutationObserver(() => document.querySelectorAll('.fi[data-v="S"]:not([list]),.fi[data-v="T"]:not([list])').forEach((el) => el.setAttribute('list', 'dl' + el.dataset.v))).observe(document.body, { childList: true, subtree: true });
render();
})();

</script>
</body>
</html>
