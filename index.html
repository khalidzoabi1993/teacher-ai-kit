.sp{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:var(--sh)}
.prof{border:2px solid var(--warn);margin-top:-14px;position:relative}
.prof h2{margin:0 0 2px;font:800 21px/1.3 inherit;font-family:inherit}
.prof>p{margin:0 0 12px;color:var(--soft);font-size:15px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}

label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
input,select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--warn) 45%,transparent);border-color:var(--warn)}
.ready{margin-top:10px;font-weight:700;font-size:15px}
.ready.ok{color:var(--tw)}.ready.no{color:var(--warn)}
.tabs{display:flex;gap:6px;margin:22px 0 6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;color:var(--soft)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{display:none}.pane.on{display:block}
.part{display:flex;align-items:center;gap:10px;margin:26px 0 2px}
.part b{font:900 24px/1 inherit;font-family:inherit;color:var(--c)}
.part span{color:var(--muted);font-weight:500}
.part::after{content:"";flex:1;height:2px;background:var(--line)}
.step{border-inline-start:6px solid var(--c)}
.step.done{opacity:.7}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.num{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
:root[data-theme="dark"] .num{color:#0d0f16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:#0d0f16}}
.sh h3{margin:0;font:800 20px/1.3 inherit;font-family:inherit;flex:1}
.dn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;margin:0}
.dn input{width:20px;height:20px;accent-color:var(--tw);padding:0}
ol.do{margin:6px 0 8px;padding-inline-start:22px}ol.do li{margin:3px 0}
.pr{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.prh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prh b{font-size:15px;color:var(--c);flex:1;min-width:120px}
.prh b:empty{min-width:0}
.txt{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.6}
.txt .v{color:var(--c);font-weight:700}
.f{background:var(--fld);color:var(--fldink);border-radius:6px;padding:0 5px;font-weight:700;display:inline-block;unicode-bidi:isolate;white-space:nowrap;line-height:1.4}

.btn{border:0;border-radius:999px;padding:8px 18px;font-weight:800;font-size:15px;background:var(--c);color:#fff;white-space:nowrap}
:root[data-theme="dark"] .btn{color:#0d0f16}

.btn.ok{background:var(--warn)}
.btn.gh{background:none;border:1.5px solid var(--line);color:var(--soft);font-weight:700;padding:7px 14px}
.edited{font-size:13px;color:var(--warn);font-weight:700;margin-top:6px}

</head>

const LIB = [['opening','plan','any'],['plan','plan','gemini'],['worksheet','adapt','any'],['simplify','adapt','any'],['explain','adapt','any'],['mcq','assess','any'],['quiz','assess','testwise'],['check','assess','any'],['game','learn','claude'],['tutor','learn','any'],['parents','comm','any'],['feedback','comm','any'],['vocab','lang','any']];

(() => {
const $ = (s) => document.querySelector(s);
const ST = 'tkit-v1';
let S = { lang: null, S: '', G: '', L: '', T: '', done: [], edits: {}, tab: 's2', cat: 'all' };

const save = () => { try { localStorage.setItem(ST, JSON.stringify(S)); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const U = () => I18N[S.lang];
const vals = () => { const u = U(); return { S: S.S.trim(), G: S.G ? u.grades[S.G] : '', L: S.L ? u.langs[S.L] : '', T: S.T.trim() }; };
function fill(key, html) {
  const u = U(), v = vals(); let t = PROMPTS[S.lang][key];
  if (!html) return t.replace(/\{([SGLT])\}/g, (_, k) => v[k] || u.ph[k]);
  return esc(t).replace(/\{([SGLT])\}/g, (_, k) => v[k] ? `<span class="v">${esc(v[k])}</span>` : `<span class="f">${u.ph[k]}</span>`).replace(/\[([^\]{}]+)\]/g, (m) => `<span class="f">${m}</span>`);
}
const ekey = (k) => S.lang + ':' + k;

  const u = U(), ed = S.edits[ekey(key)];
  return `<div class="pr" data-k="${key}" style="--c:${color}"><div class="prh"><b>${esc((title || TITLES[S.lang][key]).trim())}</b><button class="btn gh" data-a="edit">${u.editB}</button><button class="btn" data-a="copy">${u.copy}</button></div>`

}
const openBtn = (t) => `<a class="open" href="${TOOLS[t][1]}" target="_blank" rel="noopener">${U().open} <span class="ltr">${TOOLS[t][0]}</span> ↗</a>`;

function renderS2() {
  const u = U(); let h = '';
  u.steps.forEach((st, i) => {
    const [title, items, prompts, note, checks] = st, c = i < 4 ? 'var(--gem)' : 'var(--tw)';
    if (i === 0) h += `<div class="part" style="--c:var(--gem)"><b class="ltr">Gemini</b><span>${u.partA}</span></div>`;
    if (i === 4) h += `<div class="part" style="--c:var(--tw)"><b class="ltr">TestWiseAI</b><span>${u.partB}</span></div>`;
    const done = S.done.includes(i);
    h += `<section class="card step${done ? ' done' : ''}" style="--c:${c}" data-i="${i}"><div class="sh"><span class="num">${i + 1}</span><h3>${esc(title)}</h3><label class="dn"><input type="checkbox"${done ? ' checked' : ''}>${u.done}</label></div>`;
    if (items.length) h += `<ol class="do">${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
    if (i === 0) h += openBtn('gemini');
    if (i === 4) h += openBtn('testwise');
    if (prompts) h += prompts.map((k) => promptBox(k, c)).join('');
    if (checks) h += `<ul class="ck">${checks.map((x) => `<li><input type="checkbox"><span>${esc(x)}</span></li>`).join('')}</ul>`;
    if (note) h += `<div class="note${i === 3 || i === 6 ? ' b' : ''}"><span>${i === 3 ? '⚠️' : i === 6 ? '✏️' : '💡'}</span><span>${esc(note)}</span></div>`;
    h += `</section>`;
  });
  h += `<section class="card hw"><h3>${esc(u.task[0])}</h3><ol class="do">${u.task.slice(1).map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
  $('#s2').innerHTML = h; prog();
}
const TC = { gemini: 'var(--gem)', testwise: 'var(--tw)', claude: 'var(--cl)', any: 'var(--any)' };
function renderLib() {
  const u = U(); let h = `<div class="chips">` + ['all', ...Object.keys(u.cats)].map((c) => `<button data-cat="${c}" class="${S.cat === c ? 'on' : ''}">${c === 'all' ? u.all : u.cats[c]}</button>`).join('') + `</div>`;
  LIB.filter(([, cat]) => S.cat === 'all' || cat === S.cat).forEach(([k, cat, tool]) => {
    const c = TC[tool], tname = tool === 'any' ? u.any : TOOLS[tool][0];
    h += `<section class="card lib" style="--c:${c}"><div class="sh"><h3>${esc(TITLES[S.lang][k])}</h3><span class="tag">${esc(u.cats[cat])} · ${esc(tname)}</span></div>${promptBox(k, c, ' ')}<div>${tool === 'any' ? ['chatgpt', 'gemini', 'claude'].map(openBtn).join('') : openBtn(tool)}</div></section>`;
  });
  $('#lib').innerHTML = h;
}
function renderHow() {
  const u = U();
  $('#how').innerHTML = `<section class="card"><h3 style="margin:0 0 10px">${esc(u.rulesH)}</h3><div class="rules">${u.rules.map(([a, b]) => `<div class="rule"><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div>
    <div class="cmp x"><h4>✗ ${esc(u.badH)}</h4><p>${esc(u.bad)}</p><small>${esc(u.badWhy)}</small></div>
    <div class="cmp v"><h4>✓ ${esc(u.goodH)}</h4><p>${esc(u.good)}</p></div></section>
    <section class="card"><h3 style="margin:0">${esc(u.tipsH)}</h3><ol class="tips">${u.tips.map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
}
function prog() { const n = S.done.length; $('#prog').textContent = `${n} ${U().of} 8`; $('#progFill').style.width = (n / 8 * 100) + '%'; }
function fields() {
  const u = U(), g = $('#fG'), l = $('#fL');
  g.innerHTML = `<option value="">${u.choose}</option>` + [7, 8, 9].map((k) => `<option value="${k}">${u.grades[k]}</option>`).join('');
  l.innerHTML = `<option value="">${u.choose}</option>` + ['ar', 'he', 'en'].map((k) => `<option value="${k}">${u.langs[k]}</option>`).join('');
  $('#fS').value = S.S; $('#fT').value = S.T; g.value = S.G; l.value = S.L;
  $('#fS').placeholder = u.fSph; $('#fT').placeholder = u.fTph;

function readyLine() { const n = ['S', 'G', 'L', 'T'].filter((k) => !String(S[k]).trim()).length, r = $('#ready'); r.textContent = n ? U().left(n) : U().ready; r.className = 'ready ' + (n ? 'no' : 'ok'); }
function refreshTexts() { document.querySelectorAll('.pr').forEach((el) => { const t = el.querySelector('.txt'); if (t) t.innerHTML = fill(el.dataset.k, true); }); readyLine(); }
function applyLang() {
  const u = U(); document.documentElement.lang = S.lang; document.documentElement.dir = u.dir; document.title = u.title;

}
function showTab(p) { S.tab = p; document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.p === p)); document.querySelectorAll('.pane').forEach((x) => x.classList.toggle('on', x.id === p)); $('#bar').classList.toggle('on', p === 's2'); save(); }

document.querySelectorAll('#langs button').forEach((b) => b.addEventListener('click', () => { S.lang = b.dataset.l; save(); applyLang(); }));
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.p)));
[['fS', 'S', 'input'], ['fT', 'T', 'input'], ['fG', 'G', 'change'], ['fL', 'L', 'change']].forEach(([id, k, ev]) => $('#' + id).addEventListener(ev, (e) => { S[k] = e.target.value; save(); refreshTexts(); }));
$('#thm').addEventListener('click', () => { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; });
document.addEventListener('click', (e) => {
  const cat = e.target.closest('[data-cat]'); if (cat) { S.cat = cat.dataset.cat; save(); renderLib(); return; }
  const b = e.target.closest('.pr [data-a]'); if (!b) return;

});
function rerenderBox(box) { const k = box.dataset.k, c = box.style.getPropertyValue('--c'), title = box.querySelector('.prh b').textContent; const tmp = document.createElement('div'); tmp.innerHTML = promptBox(k, c, title); box.replaceWith(tmp.firstChild); }
